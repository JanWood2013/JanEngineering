<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Jan – F1 Race Engineer Journey</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #05060a;
      --bg-card: #10121a;
      --accent: #00d1b2;
      --accent-soft: rgba(0, 209, 178, 0.12);
      --text: #f5f5f7;
      --text-muted: #a0a3b1;
      --border: #262938;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius: 12px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background: radial-gradient(circle at top, #15182a 0, #05060a 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .page { width: 100%; max-width: 1100px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .lang-switch {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .lang-btn {
      font-size: 0.78rem;
      padding: 4px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .lang-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-left: 1px solid rgba(0, 0, 0, 0.4);
      border-right: 1px solid rgba(0, 0, 0, 0.4);
    }

    .lock-icon {
      font-size: 0.9rem;
      color: var(--text-muted);
      opacity: 0.7;
      cursor: default;
      user-select: none;
    }

    .hero {
      background: linear-gradient(135deg, rgba(0, 209, 178, 0.12), rgba(0, 0, 0, 0.7));
      border-radius: 24px;
      padding: 28px 28px 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr);
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 800px) {
      .hero { grid-template-columns: 1fr; }
    }

    .hero-main-title {
      font-size: clamp(2.2rem, 3vw, 2.8rem);
      font-weight: 750;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      max-width: 520px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.35);
    }

    .tag-accent {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .hero-meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-meta span::before {
      content: "•";
      color: var(--accent);
      font-size: 1.1em;
    }

    .hero-right { justify-self: end; text-align: right; }

    @media (max-width: 800px) {
      .hero-right { justify-self: flex-start; text-align: left; }
    }

    .hero-status-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .hero-status-box {
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hero-status-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0, 209, 178, 0.9);
    }

    .hero-status-expiry {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .hero-links {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    @media (max-width: 800px) {
      .hero-links { justify-content: flex-start; }
    }

    .hero-link-btn {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.6);
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease-out;
    }

    .hero-link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(0, 209, 178, 0.25);
    }

    .hero-link-btn span.icon { font-size: 0.9em; opacity: 0.9; }

    .layout {
      margin-top: 26px;
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.3fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px 18px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .card + .card { margin-top: 14px; }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pill {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-muted);
    }

    .pill-accent {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }

    .list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--text-muted);
    }

    .list li::before {
      content: "▹";
      color: var(--accent);
      margin-top: 1px;
      font-size: 0.8rem;
    }

    .pinned-item {
      padding: 10px 10px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
    }

    .pinned-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .pinned-body {
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-item {
      padding: 10px 10px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.35);
    }

    .post-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }

    .post-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .post-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .post-excerpt {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .post-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }

    .post-link:hover { text-decoration: underline; }

    .code-block {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.8rem;
      background: #05060a;
      border-radius: 10px;
      border: 1px solid #262938;
      padding: 10px 12px;
      overflow-x: auto;
      color: #e5e7f0;
      margin-top: 6px;
    }

    .code-block pre { white-space: pre; }

    .muted {
      color: var(--text-muted);
      font-size: 0.86rem;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <span class="lock-icon">🔒</span>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <header class="hero">
      <div>
        <div class="hero-main-title" id="hero-title"></div>
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <div class="hero-tags">
          <span class="tag tag-accent" id="tag-main"></span>
          <span class="tag" id="tag-1"></span>
          <span class="tag" id="tag-2"></span>
          <span class="tag" id="tag-3"></span>
        </div>
        <div class="hero-meta">
          <span id="meta-location"></span>
          <span id="meta-goal"></span>
          <span id="meta-format"></span>
        </div>
      </div>

      <div class="hero-right">
        <div id="status-block">
          <div class="hero-status-label" id="status-label"></div>
          <div class="hero-status-box">
            <div class="hero-status-text">
              <span class="hero-status-dot"></span>
              <span id="status-text"></span>
            </div>
            <div class="hero-status-expiry" id="status-expiry"></div>
          </div>
        </div>

        <div class="hero-links" id="hero-links"></div>
      </div>
    </header>

    <main class="layout">
      <section>
        <article class="card">
          <div class="card-header">
            <div>
              <div class="card-title" id="updates-title"></div>
              <div class="card-subtitle" id="updates-subtitle"></div>
            </div>
            <span class="pill pill-accent" id="updates-pill"></span>
          </div>
          <div id="posts-list" class="posts-list"></div>
        </article>

        <article class="card">
          <div class="card-header">
            <div class="card-title" id="examples-title"></div>
          </div>
          <div>
            <div class="section-title" id="example-image-title"></div>
            <p class="muted" id="example-image-text"></p>
            <div class="code-block">
              <pre>![Streckenlayout](/assets/img/track-layout.png)</pre>
            </div>

            <div class="section-title" style="margin-top: 12px;" id="example-drawing-title"></div>
            <p class="muted" id="example-drawing-text"></p>
            <div class="code-block">
              <pre>![Bremssattel Zeichnung](/assets/drawings/brake-caliper.png)</pre>
            </div>

            <div class="section-title" style="margin-top: 12px;" id="example-script-title"></div>
            <p class="muted" id="example-script-text"></p>
            <div class="code-block">
              <pre>[Download Script](/scripts/tool.py)</pre>
            </div>

            <div class="section-title" style="margin-top: 12px;" id="example-codeblock-title"></div>
            <div class="code-block">
<pre>```python
# Script‑Beispiel
pass
```</pre>
            </div>
          </div>
        </article>
      </section>

      <aside>
        <section class="card" id="info-card">
          <div class="card-header">
            <div class="card-title" id="info-title"></div>
          </div>
          <ul class="list" id="info-list"></ul>
        </section>

        <section class="card" id="pinned-card">
          <div class="card-header">
            <div class="card-title" id="pinned-title"></div>
            <span class="pill">Pinned</span>
          </div>
          <div id="pinned-list"></div>
        </section>

        <section class="card">
          <div class="card-header">
            <div class="card-title" id="structure-title"></div>
          </div>
          <p class="muted" id="structure-text"></p>
          <ul class="list" style="margin-top: 8px;" id="structure-list"></ul>
        </section>
      </aside>
    </main>

    <div class="footer-note" id="footer-note"></div>
  </div>

  <script>
    const config = {
      de: {
        heroTitle: "",
        heroSubtitle: "",
        tags: ["", "", "", ""],
        metaLocation: "",
        metaGoal: "",
        metaFormat: "",
        statusLabel: "",
        statusText: "",
        statusExpiry: "",
        links: [],
        infoTitle: "",
        info: [],
        pinnedTitle: "",
        pinned: [],
        updatesTitle: "",
        updatesSubtitle: "",
        updatesPill: "",
        posts: [],
        examplesTitle: "",
        exampleImageTitle: "",
        exampleImageText: "",
        exampleDrawingTitle: "",
        exampleDrawingText: "",
        exampleScriptTitle: "",
        exampleScriptText: "",
        exampleCodeblockTitle: "",
        structureTitle: "",
        structureText: "",
        structureList: [],
        footerNote: ""
      },
      en: {
        heroTitle: "",
        heroSubtitle: "",
        tags: ["", "", "", ""],
        metaLocation: "",
        metaGoal: "",
        metaFormat: "",
        statusLabel: "",
        statusText: "",
        statusExpiry: "",
        links: [],
        infoTitle: "",
        info: [],
        pinnedTitle: "",
        pinned: [],
        updatesTitle: "",
        updatesSubtitle: "",
        updatesPill: "",
        posts: [],
        examplesTitle: "",
        exampleImageTitle: "",
        exampleImageText: "",
        exampleDrawingTitle: "",
        exampleDrawingText: "",
        exampleScriptTitle: "",
        exampleScriptText: "",
        exampleCodeblockTitle: "",
        structureTitle: "",
        structureText: "",
        structureList: [],
        footerNote: ""
      }
    };

    function renderLanguage(lang) {
      const c = config[lang];

      document.documentElement.lang = lang === "de" ? "de" : "en";

      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (value && value.trim() !== "") {
          el.textContent = value;
          el.parentElement?.style && (el.parentElement.style.display = "");
        } else {
          el.textContent = "";
        }
      };

      setText("hero-title", c.heroTitle);
      setText("hero-subtitle", c.heroSubtitle);

      document.getElementById("tag-main").textContent = c.tags[0] || "";
      document.getElementById("tag-1").textContent = c.tags[1] || "";
      document.getElementById("tag-2").textContent = c.tags[2] || "";
      document.getElementById("tag-3").textContent = c.tags[3] || "";

      setText("meta-location", c.metaLocation);
      setText("meta-goal", c.metaGoal);
      setText("meta-format", c.metaFormat);

      const statusBlock = document.getElementById("status-block");
      if (c.statusText && c.statusText.trim() !== "") {
        statusBlock.style.display = "";
        setText("status-label", c.statusLabel);
        setText("status-text", c.statusText);
        const expiryEl = document.getElementById("status-expiry");
        if (c.statusExpiry && c.statusExpiry.trim() !== "") {
          expiryEl.style.display = "";
          expiryEl.textContent = c.statusExpiry;
        } else {
          expiryEl.style.display = "none";
        }
      } else {
        statusBlock.style.display = "none";
      }

      const linksContainer = document.getElementById("hero-links");
      linksContainer.innerHTML = "";
      if (Array.isArray(c.links) && c.links.length > 0) {
        c.links.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "hero-link-btn";
          const iconSpan = document.createElement("span");
          iconSpan.className = "icon";
          iconSpan.textContent = link.icon || "↗";
          const labelSpan = document.createElement("span");
          labelSpan.textContent = link.label;
          a.appendChild(iconSpan);
          a.appendChild(labelSpan);
          linksContainer.appendChild(a);
        });
      }

      const infoCard = document.getElementById("info-card");
      const infoList = document.getElementById("info-list");
      infoList.innerHTML = "";
      setText("info-title", c.infoTitle);
      if (Array.isArray(c.info) && c.info.length > 0) {
        infoCard.style.display = "";
        c.info.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item;
          infoList.appendChild(li);
        });
      } else {
        infoCard.style.display = "none";
      }

      const pinnedCard = document.getElementById("pinned-card");
      const pinnedList = document.getElementById("pinned-list");
      pinnedList.innerHTML = "";
      setText("pinned-title", c.pinnedTitle);
      if (Array.isArray(c.pinned) && c.pinned.length > 0) {
        pinnedCard.style.display = "";
        c.pinned.forEach(item => {
          const div = document.createElement("div");
          div.className = "pinned-item";
          const t = document.createElement("div");
          t.className = "pinned-title";
          t.textContent = item.title;
          const b = document.createElement("div");
          b.className = "pinned-body";
          b.textContent = item.body;
          div.appendChild(t);
          div.appendChild(b);
          pinnedList.appendChild(div);
        });
      } else {
        pinnedCard.style.display = "none";
      }

      setText("updates-title", c.updatesTitle);
      setText("updates-subtitle", c.updatesSubtitle);
      setText("updates-pill", c.updatesPill);

      const postsList = document.getElementById("posts-list");
      postsList.innerHTML = "";
      if (Array.isArray(c.posts) && c.posts.length > 0) {
        const sorted = [...c.posts].sort((a, b) => new Date(b.date) - new Date(a.date));
        sorted.forEach(post => {
          const item = document.createElement("div");
          item.className = "post-item";

          const row = document.createElement("div");
          row.className = "post-title-row";

          const title = document.createElement("div");
          title.className = "post-title";
          title.textContent = post.title || "";

          const date = document.createElement("div");
          date.className = "post-date";
          if (post.date) {
            const d = new Date(post.date);
            date.textContent = d.toLocaleDateString(lang === "de" ? "de-DE" : "en-GB");
          } else {
            date.textContent = "";
          }

          row.appendChild(title);
          row.appendChild(date);

          const excerpt = document.createElement("div");
          excerpt.className = "post-excerpt";
          excerpt.textContent = post.excerpt || "";

          const link = document.createElement("a");
          link.className = "post-link";
          link.href = post.url || "#";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = lang === "de" ? "Weiterlesen" : "Read more";

          item.appendChild(row);
          if (post.excerpt) item.appendChild(excerpt);
          item.appendChild(link);
          postsList.appendChild(item);
        });
      }

      setText("examples-title", c.examplesTitle);
      setText("example-image-title", c.exampleImageTitle);
      setText("example-image-text", c.exampleImageText);
      setText("example-drawing-title", c.exampleDrawingTitle);
      setText("example-drawing-text", c.exampleDrawingText);
      setText("example-script-title", c.exampleScriptTitle);
      setText("example-script-text", c.exampleScriptText);
      setText("example-codeblock-title", c.exampleCodeblockTitle);

      setText("structure-title", c.structureTitle);
      setText("structure-text", c.structureText);
      const structureList = document.getElementById("structure-list");
      structureList.innerHTML = "";
      if (Array.isArray(c.structureList) && c.structureList.length > 0) {
        c.structureList.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item;
          structureList.appendChild(li);
        });
      }

      setText("footer-note", c.footerNote);

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        renderLanguage(lang);
      });
    });

    renderLanguage("de");
  </script>
</body>
</html>
